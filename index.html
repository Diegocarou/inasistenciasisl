<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Asistencias - ISL</title>
  <style>
    :root {
      --azul-primario: #2b326b;
      --oro-acento: #c5a059;
      --bg-gris: #f4f6f9;
      --p-verde: #2ecc71;
      --a-rojo: #e74c3c;
      --aj-verde-oscuro: #27ae60;
      --texto-oscuro: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-gris); display: flex; flex-direction: column; height: 100vh; color: var(--texto-oscuro); }

    .header-institucional { background-color: var(--azul-primario); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .header-institucional h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .header-acciones { display: flex; align-items: center; gap: 15px; }

    .nav-tabs-header { display: flex; gap: 8px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 6px; }
    .btn-tab { background: transparent; border: none; color: white; padding: 8px 16px; border-radius: 4px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-tab.activa { background: var(--oro-acento); color: white; }

    .contenedor-fecha { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 6px; display: flex; align-items: center; }
    .contenedor-fecha input { border: none; background: transparent; color: white; font-size: 15px; font-weight: bold; outline: none; cursor: pointer; text-align: center; }
    .contenedor-fecha input::-webkit-calendar-picker-indicator { filter: invert(1); }

    .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-logout:hover { background: #c0392b; }

    .overlay-login { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(30, 41, 59, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .card-login { background: white; padding: 35px; border-radius: 10px; width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    .card-login h2 { color: var(--azul-primario); margin-bottom: 5px; font-size: 22px; }
    .card-login p { color: #64748b; font-size: 13px; margin-bottom: 20px; }
    .input-login { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .btn-login { width: 100%; padding: 12px; background: var(--azul-primario); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }

    .contenedor-aplicacion { flex: 1; display: flex; overflow: hidden; }

    .panel-navegacion { width: 280px; background: white; border-right: 1px solid #e2e8f0; padding: 25px 20px; display: flex; flex-direction: column; gap: 20px; }
    .titulo-seccion { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    .select-curso { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 15px; font-weight: 600; outline: none; background-color: #fafafa; cursor: pointer; }

    .lista-botones-materias { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; margin-top: 10px; }
    .btn-materia { width: 100%; padding: 14px; text-align: left; border: none; background: #f1f5f9; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-materia.seleccionada { background: var(--oro-acento); color: white; }
    .btn-materia.confirmada { background-color: var(--p-verde); color: white; }

    .panel-trabajo { flex: 1; display: flex; flex-direction: column; padding: 30px; overflow-y: auto; }
    #bloque-asistencia-activa { flex-direction: column !important; width: 100%; }

    .banner-suspension { background: white; border: 2px solid #e2e8f0; border-radius: 8px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; font-weight: 600; margin-bottom: 20px; cursor: pointer; }
    .banner-suspension.activo { border-color: var(--p-verde); background: #f0fdf4; color: #166534; }

    .contenedor-alumnos { background: white; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 20px; width: 100%; }
    .item-alumno { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid #f1f5f9; }
    .nombre-alumno { font-size: 15px; font-weight: 600; }

    .btn-ciclo-asistencia { width: 150px; padding: 10px 0; border: none; border-radius: 6px; font-weight: 700; font-size: 13px; color: white; cursor: pointer; text-transform: uppercase; }
    .estado-p { background-color: var(--p-verde); }
    .estado-a { background-color: var(--a-rojo); }
    .estado-aj { background-color: var(--aj-verde-oscuro); border: 2px solid var(--azul-primario); }

    .btn-confirmar-total { background-color: var(--azul-primario); color: white; border: none; padding: 14px 35px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .pantalla-espera { display: flex; flex: 1; align-items: center; justify-content: center; font-size: 15px; color: #64748b; text-align: center; flex-direction: column; gap: 10px; }

    .tabla-matriz { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
    .tabla-matriz th, .tabla-matriz td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .tabla-matriz th { background: var(--azul-primario); color: white; font-size: 13px; text-transform: uppercase; }
    .badge-fecha { display: inline-block; background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin: 2px; }

    @media (max-width: 768px) {
      .header-institucional { flex-direction: column; height: auto; padding: 15px; gap: 10px; }
      .contenedor-aplicacion { flex-direction: column; }
      .panel-navegacion { width: 100%; border-right: none; }
      .panel-trabajo { padding: 15px; }
      .item-alumno { flex-direction: column; align-items: flex-start; gap: 10px; }
      .btn-ciclo-asistencia { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- MODAL DE LOGIN -->
  <div id="pantalla-login" class="overlay-login">
    <div class="card-login">
      <h2>Instituto Santa Lucía</h2>
      <p>Gestión de Asistencia en Contraturno</p>
      <input type="email" id="login-email" class="input-login" placeholder="Correo institucional">
      <input type="password" id="login-pass" class="input-login" placeholder="Contraseña">
      <button class="btn-login" onclick="iniciarSesion()">Ingresar</button>
      <div id="login-error" style="color: red; font-size: 13px; margin-top: 10px; display: none;"></div>
    </div>
  </div>

  <!-- HEADER INSTITUCIONAL -->
  <header class="header-institucional">
    <h1>ISL - Contraturno</h1>
    
    <div class="nav-tabs-header">
      <button id="tab-tomar" class="btn-tab activa" onclick="cambiarVista('tomar')">📝 Tomar Asistencia</button>
      <button id="tab-dashboard" class="btn-tab" onclick="cambiarVista('dashboard')">📊 Inasistencias Mensuales</button>
    </div>

    <div class="header-acciones">
      <div class="contenedor-fecha" id="box-fecha-diaria">
        <input type="date" id="fecha-global" onchange="obtenerDatosServidor()">
      </div>
      <div class="contenedor-fecha" id="box-fecha-mensual" style="display: none;">
        <input type="month" id="mes-global" onchange="cargarMatrizMensual()">
      </div>
      <span id="usuario-badge" style="font-size: 13px; font-weight: 600;"></span>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </header>

  <!-- CUERPO PRINCIPAL -->
  <div class="contenedor-aplicacion">
    <aside id="panel-nav-asistencia" class="panel-navegacion">
      <div>
        <div class="titulo-seccion" style="margin-bottom: 8px;">1: Seleccionar Curso</div>
        <select id="select-curso" class="select-curso" onchange="cambiarCurso()"></select>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column;">
        <div class="titulo-seccion">2: Materias</div>
        <div id="lista-materias" class="lista-botones-materias"></div>
      </div>
    </aside>

    <main id="panel-principal-trabajo" class="panel-trabajo">
      
      <!-- PESTAÑA 1 -->
      <div id="seccion-asistencia" style="width: 100%;">
        <div id="mensaje-inicial" class="pantalla-espera">
          <p>Elija un curso y seleccione la materia para desplegar la nómina.</p>
        </div>

        <div id="bloque-asistencia-activa" style="display: none;">
          <label id="label-suspension" class="banner-suspension" for="check-suspension">
            <input type="checkbox" id="check-suspension" onchange="procesarCambioSuspension(this.checked)">
            <span>Marcar este bloque horario como SUSPENDIDO (No computará ausencias)</span>
          </label>

          <div id="lista-alumnos-planilla" class="contenedor-alumnos"></div>

          <div class="bloque-confirmacion">
            <button class="btn-confirmar-total" onclick="enviarAsistenciaFormulario()">Confirmar Asistencia</button>
          </div>
        </div>
      </div>

      <!-- PESTAÑA 2 -->
      <div id="seccion-dashboard" style="display: none; width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
          <h3 style="margin: 0;">Inasistencias por Estudiante</h3>
          <div style="display: flex; gap: 10px;">
            <select id="select-curso-dashboard" class="select-curso" style="width: auto; min-width: 140px;" onchange="actualizarMateriasDashboard()"></select>
            <select id="select-materia-dashboard" class="select-curso" style="width: auto; min-width: 200px;" onchange="cargarMatrizMensual()">
              <option value="">Todas las Materias</option>
            </select>
          </div>
        </div>

        <div id="tabla-matriz-contenedor">
          <p class="text-muted">Cargando reporte mensual...</p>
        </div>
      </div>

    </main>
  </div>

  <script>
    // IMPORTANTE: REEMPLAZA ESTA URL CON TU NUEVA URL DE DESPLIEGUE DESPUES DE ACTUALIZAR codigo.gs
    const API_GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwYnL1lgVrKbevgIyvGOGbuuolMpR2HSzOG_ivYTwi7yoeZ3-0qfgK9Hm0nxOb7t5jHHg/exec"; 
    
    let emailActivo = localStorage.getItem('preceptorEmail') || "";
    let cursosDisponibles = {};
    let cursoActivo = "";

    window.onload = function() {
      const fechaHoy = new Date();
      const tzOffset = fechaHoy.getTimezoneOffset() * 60000;
      const fechaLocal = new Date(fechaHoy.getTime() - tzOffset);
      
      document.getElementById('fecha-global').value = fechaLocal.toISOString().split('T')[0];
      document.getElementById('mes-global').value = fechaLocal.toISOString().substring(0, 7);

      if (emailActivo) {
        mostrarAplicacion();
      } else {
        document.getElementById('pantalla-login').style.display = 'flex';
      }
    };

    function apiPost(payload) {
      return fetch(API_GOOGLE_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow'
      }).then(res => res.json());
    }

    function iniciarSesion() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      const errBox = document.getElementById('login-error');

      errBox.style.display = 'none';

      apiPost({ action: 'login', email: email, password: pass })
        .then(res => {
          if (res && res.exito) {
            emailActivo = res.email;
            localStorage.setItem('preceptorEmail', res.email);
            localStorage.setItem('preceptorNombre', res.nombre);
            
            document.getElementById('pantalla-login').style.display = 'none';
            mostrarAplicacion();
          } else {
            errBox.innerText = (res && res.error) ? res.error : "Error de credenciales";
            errBox.style.display = 'block';
          }
        })
        .catch(err => {
          errBox.innerText = "Error de conexión con el servidor. Verifique la configuración del despliegue en Apps Script.";
          errBox.style.display = 'block';
        });
    }

    function cerrarSesion() {
      localStorage.clear();
      emailActivo = "";
      document.getElementById('pantalla-login').style.display = 'flex';
    }

    function mostrarAplicacion() {
      document.getElementById('usuario-badge').innerText = emailActivo;
      obtenerDatosServidor();
    }

    function cambiarVista(vista) {
      document.getElementById('tab-tomar').classList.remove('activa');
      document.getElementById('tab-dashboard').classList.remove('activa');

      if (vista === 'tomar') {
        document.getElementById('tab-tomar').classList.add('activa');
        document.getElementById('panel-nav-asistencia').style.display = 'flex';
        document.getElementById('seccion-asistencia').style.display = 'block';
        document.getElementById('seccion-dashboard').style.display = 'none';
        document.getElementById('box-fecha-diaria').style.display = 'flex';
        document.getElementById('box-fecha-mensual').style.display = 'none';
      } else {
        document.getElementById('tab-dashboard').classList.add('activa');
        document.getElementById('panel-nav-asistencia').style.display = 'none';
        document.getElementById('seccion-asistencia').style.display = 'none';
        document.getElementById('seccion-dashboard').style.display = 'block';
        document.getElementById('box-fecha-diaria').style.display = 'none';
        document.getElementById('box-fecha-mensual').style.display = 'flex';
        
        poblarSelectorCursosDashboard();
      }
    }

    function obtenerDatosServidor() {
      const fecha = document.getElementById('fecha-global').value;
      if (!fecha || !emailActivo) return;

      document.getElementById('bloque-asistencia-activa').style.display = 'none';
      document.getElementById('mensaje-inicial').style.display = 'flex';
      document.getElementById('mensaje-inicial').innerHTML = '<p>Sincronizando grilla de cursos...</p>';

      apiPost({ action: 'iniciar', email: emailActivo, fecha: fecha })
        .then(res => {
          if (res.exito) {
            cursosDisponibles = res.cursos;
            construirSelectorCursos();
            document.getElementById('mensaje-inicial').innerHTML = '<p>Elija un curso y seleccione las materias correspondientes.</p>';
          } else {
            document.getElementById('mensaje-inicial').innerHTML = `<p style="color:red;">${res.error || 'Error de sincronización'}</p>`;
          }
        });
    }

    function construirSelectorCursos() {
      const select = document.getElementById('select-curso');
      select.innerHTML = '<option value="">Elegir...</option>';
      
      Object.keys(cursosDisponibles).forEach(c => {
        let opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
      document.getElementById('lista-materias').innerHTML = '';
      cursoActivo = "";
    }

    function cambiarCurso() {
      cursoActivo = document.getElementById('select-curso').value;
      const contenedorMaterias = document.getElementById('lista-materias');
      contenedorMaterias.innerHTML = '';
      
      document.getElementById('bloque-asistencia-activa').style.display = 'none';
      document.getElementById('mensaje-inicial').style.display = 'flex';

      if (!cursoActivo) return;

      const materias = cursosDisponibles[cursoActivo] || [];
      materias.forEach(mat => {
        let btn = document.createElement('button');
        btn.className = 'btn-materia';
        btn.textContent = mat;
        btn.onclick = function() {
          btn.classList.toggle('seleccionada');
          evaluarDespliegueNomina();
        };
        contenedorMaterias.appendChild(btn);
      });
    }

    function evaluarDespliegueNomina() {
      const seleccionadas = document.querySelectorAll('.btn-materia.seleccionada').length;
      if (seleccionadas > 0) {
        if (document.getElementById('bloque-asistencia-activa').style.display === 'none') {
          cargarNominaEstudiantes();
        }
      } else {
        document.getElementById('bloque-asistencia-activa').style.display = 'none';
        document.getElementById('mensaje-inicial').style.display = 'flex';
      }
    }

    function cargarNominaEstudiantes() {
      document.getElementById('mensaje-inicial').innerHTML = '<p>Cargando lista de alumnos...</p>';
      document.getElementById('mensaje-inicial').style.display = 'flex';

      apiPost({ action: 'getAlumnos', curso: cursoActivo })
        .then(res => {
          renderizarPlanilla(res.alumnos);
        });
    }

    function renderizarPlanilla(alumnos) {
      const planilla = document.getElementById('lista-alumnos-planilla');
      planilla.innerHTML = '';
      document.getElementById('check-suspension').checked = false;

      alumnos.forEach(alumno => {
        let fila = document.createElement('div');
        fila.className = 'item-alumno';
        let bloqueDatos = document.createElement('div');
        let spanNombre = document.createElement('span');
        spanNombre.className = 'nombre-alumno';
        spanNombre.textContent = alumno;
        bloqueDatos.appendChild(spanNombre);

        let botonAsis = document.createElement('button');
        botonAsis.className = 'btn-ciclo-asistencia estado-p';
        botonAsis.textContent = "P (Presente)";
        botonAsis.setAttribute('data-estado', 'P');
        botonAsis.onclick = function() { rotarEstadoAsistencia(botonAsis); };

        fila.appendChild(bloqueDatos);
        fila.appendChild(botonAsis);
        planilla.appendChild(fila);
      });
      document.getElementById('mensaje-inicial').style.display = 'none';
      document.getElementById('bloque-asistencia-activa').style.display = 'flex';
    }

    function rotarEstadoAsistencia(btn) {
      const estadoActual = btn.getAttribute('data-estado');
      let proximoEstado = "P";
      if (estadoActual === "P") proximoEstado = "A";
      else if (estadoActual === "A") proximoEstado = "AJ";
      else if (estadoActual === "AJ") proximoEstado = "P";
      
      btn.setAttribute('data-estado', proximoEstado);
      btn.className = 'btn-ciclo-asistencia ' + (proximoEstado === 'P' ? 'estado-p' : proximoEstado === 'A' ? 'estado-a' : 'estado-aj');
      btn.textContent = proximoEstado === 'P' ? "P (Presente)" : proximoEstado === 'A' ? "A (Ausente)" : "AJ (Justificada)";
    }

    function procesarCambioSuspension(marcado) {
      const banner = document.getElementById('label-suspension');
      const planilla = document.getElementById('lista-alumnos-planilla');
      if (marcado) {
        banner.classList.add('activo');
        planilla.classList.add('linea-verde-total');
      } else {
        banner.classList.remove('activo');
        planilla.classList.remove('linea-verde-total');
      }
    }

    function enviarAsistenciaFormulario() {
      const materiasSeleccionadas = Array.from(document.querySelectorAll('.btn-materia.seleccionada')).map(b => b.textContent);
      
      const payload = {
        fecha: document.getElementById('fecha-global').value,
        curso: cursoActivo,
        materias: materiasSeleccionadas,
        suspension: document.getElementById('check-suspension').checked,
        alumnos: Array.from(document.querySelectorAll('.item-alumno')).map(fila => ({
          nombre: fila.querySelector('.nombre-alumno').textContent,
          estado: fila.querySelector('.btn-ciclo-asistencia').getAttribute('data-estado')
        }))
      };

      document.getElementById('bloque-asistencia-activa').style.display = 'none';
      document.getElementById('mensaje-inicial').style.display = 'flex';
      document.getElementById('mensaje-inicial').innerHTML = '<p>Grabando el parte diario...</p>';

      apiPost({ action: 'guardar', email: emailActivo, payload: payload })
        .then(res => {
          if (res && res.success) {
            alert('Asistencias procesadas e impactadas correctamente.');
            document.getElementById('mensaje-inicial').innerHTML = '<p>Registro exitoso. Puede seleccionar otra materia u otro curso.</p>';
            
            document.querySelectorAll('.btn-materia.seleccionada').forEach(btn => {
              btn.classList.remove('seleccionada');
              btn.classList.add('confirmada');
            });
            document.getElementById('bloque-asistencia-activa').style.display = 'none';
          } else {
            alert('Error: ' + (res ? res.error : "Error en el servidor"));
          }
        });
    }

    function poblarSelectorCursosDashboard() {
      const select = document.getElementById('select-curso-dashboard');
      select.innerHTML = '<option value="">Todos los Cursos</option>';
      Object.keys(cursosDisponibles).forEach(c => {
        let opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
      actualizarMateriasDashboard(); 
    }

    function actualizarMateriasDashboard() {
      const curso = document.getElementById('select-curso-dashboard').value;
      const selectMateria = document.getElementById('select-materia-dashboard');
      
      selectMateria.innerHTML = '<option value="">Todas las Materias</option>';
      let materiasParaMostrar = new Set();
      
      if (curso && cursosDisponibles[curso]) {
        cursosDisponibles[curso].forEach(m => materiasParaMostrar.add(m));
      } else {
        Object.values(cursosDisponibles).forEach(materias => {
          materias.forEach(m => materiasParaMostrar.add(m));
        });
      }
      
      Array.from(materiasParaMostrar).sort().forEach(mat => {
        let opt = document.createElement('option');
        opt.value = mat;
        opt.textContent = mat;
        selectMateria.appendChild(opt);
      });
      
      cargarMatrizMensual();
    }

    function cargarMatrizMensual() {
      const mesAnio = document.getElementById('mes-global').value;
      const curso = document.getElementById('select-curso-dashboard').value;
      const materia = document.getElementById('select-materia-dashboard').value; 
      const contenedor = document.getElementById('tabla-matriz-contenedor');

      contenedor.innerHTML = '<p class="text-muted">Cargando inasistencias...</p>';

      apiPost({ action: 'getMatrizMensual', email: emailActivo, mesAnio: mesAnio, curso: curso, materia: materia })
        .then(res => {
          if (res && res.exito && res.matriz) {
            if (res.matriz.length === 0) {
              contenedor.innerHTML = '<div class="alert alert-info" style="background:#e0f2fe; color:#0369a1; padding:15px; border-radius:6px;">No se registraron inasistencias.</div>';
              return;
            }

            let html = `
              <table class="tabla-matriz">
                <thead>
                  <tr>
                    <th>Estudiante</th>
                    <th>Curso</th>
                    <th>Espacio / Contraturno</th>
                    <th>Inasistencias</th>
                    <th>Fechas de Ausencia</th>
                  </tr>
                </thead>
                <tbody>
            `;

            res.matriz.forEach(item => {
              const badgesFechas = item.fechas.map(f => `<span class="badge-fecha">${f.split('-').slice(1).reverse().join('/')}</span>`).join(' ');
              html += `
                <tr>
                  <td><strong>${item.alumno}</strong></td>
                  <td>${item.curso}</td>
                  <td>${item.materia}</td>
                  <td><span style="color:red; font-weight:bold;">${item.total}</span></td>
                  <td>${badgesFechas}</td>
                </tr>
              `;
            });

            html += '</tbody></table>';
            contenedor.innerHTML = html;
          } else {
            contenedor.innerHTML = '<div class="alert alert-danger" style="background:#fee2e2; color:#991b1b; padding:15px; border-radius:6px;">Error al cargar la matriz.</div>';
          }
        });
    }
  </script>
</body>
</html>
